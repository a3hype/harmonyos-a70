{
    "jobs": [
        {
            "name": "init",
            "cmds": [
                "mkdir /dev/memcg",
                "write /dev/memcg/memory.app_score 300",
                "write /dev/memcg/memory.name Root",
                "write /dev/memcg/memory.zswapd_single_memcg_param 0",
                "write /dev/memcg/memory.zswapd_pressure_show 0",
                "chown memmgr memmgr /dev/memcg/memory.app_score",
                "chown memmgr memmgr /dev/memcg/memory.name",
                "chown memmgr memmgr /dev/memcg/memory.zswapd_single_memcg_param",
                "chown memmgr memmgr /dev/memcg/memory.zswapd_pressure_show",
                "chmod 0664 /dev/memcg/memory.app_score",
                "chmod 0664 /dev/memcg/memory.name",
                "chmod 0664 /dev/memcg/memory.zswapd_single_memcg_param",
                "chmod 0664 /dev/memcg/memory.zswapd_pressure_show"
            ]
        },
        {
            "name": "post-fs-data",
            "cmds": [
                "mkdir /mnt/hmdfs 0711 root root",
                "mkdir /mnt/data 0711 root root",
                "mkdir /mnt/data/external 0711 root root",
                "mkdir /module_update/ArkWebCore",
                "mount none /data/a70fw/arkweb /module_update/ArkWebCore bind",
                "chown blue_host blue_host /dev/ttyHS0",
                "chmod 0660 /dev/ttyHS0",
                "chown blue_host blue_host /dev/btpower",
                "chmod 0660 /dev/btpower",
                "start blue_host",
                "start power_host",
                "start sensor_host",
                "start a70rproc"
            ]
        },
        {
            "name": "param:bootevent.boot.completed=true",
            "condition": "bootevent.boot.completed=true",
            "cmds": [
                "mount none /data/service/el2/100/hmdfs/account/files/Docs /mnt/user/100/nosharefs/docs/currentUser bind",
                "mount none /data/service/el2/100/hmdfs/account/files/Docs /mnt/user/100/sharefs/docs/currentUser bind",
                "start a70shutdownd",
                "start a70hexrpcd"
            ]
        }
    ],
    "services": [
        {
            "name": "a70hexrpcd",
            "path": [
                "/system/bin/a70-hexrpcd"
            ],
            "disabled": 1,
            "uid": "root",
            "gid": [
                "root"
            ],
            "sandbox": 0
        },
        {
            "name": "a70shutdownd",
            "path": [
                "/system/bin/a70-shutdownd"
            ],
            "disabled": 1,
            "once": 1,
            "uid": "root",
            "gid": [
                "root"
            ],
            "sandbox": 0
        },
        {
            "name": "a70rproc",
            "path": [
                "/system/bin/a70-rproc",
                "--boot"
            ],
            "disabled": 1,
            "once": 1,
            "uid": "root",
            "gid": [
                "root",
                "system"
            ],
            "sandbox": 0
        }
    ]
}
